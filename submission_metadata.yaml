# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "MacBook Pro M2"                    # Or: "AWS EC2 c5.4xlarge", "Local Linux box", etc.
  cpu_cores: 8                                  # Number of CPU cores used
  ram_gb: 16                                    # Available RAM in GB
  python_version: "3.11.4"                      # python --version
  os: "macOS 14.2"                              # Or "Ubuntu 22.04 LTS", etc.
  uses_gpu_for_inference: false                 # Must be false — see compute constraints
  has_network_during_ranking: false             # Must be false — no API calls during ranking
  pre_computation_required: false               # true if you pre-compute embeddings or train models offline
  pre_computation_time_minutes: 0               # Approximate, if applicable

# ============================================================================
# AI tools declaration
# ============================================================================
# Transparency only — declared use is NOT penalized. Be honest. Stage 5 interview
# may verify these declarations against your code; declarations that contradict
# your code or your interview are flagged.
ai_tools_used:
  - "Claude"        # e.g. for architecture discussion, code review
  - "GitHub Copilot"  # e.g. for autocomplete
  # Other options: "ChatGPT", "Cursor", "Gemini", "Codeium", "Other", "None"

ai_usage_summary: |
  We used Gemini for architectural planning, code completion, and fine-tuning guidance. The final ranking pipeline operates completely locally using an open-weights embedding model and heuristic scoring combined with a local LLM fallback, without sending any candidate data to external APIs.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Our approach is a hybrid semantic-retrieval and heuristic scoring system. We first apply a honeypot pre-filter. Then we use BAAI/bge-small-en-v1.5 to encode the parsed Job Description and all candidate profiles, storing them in a FAISS index to retrieve the top 2000 candidates based on semantic similarity. We then apply hard filters for years of experience, followed by a heuristic pre-score that incorporates semantic match, recruiter response rate, and github activity. The top 200 candidates are then ranked using an ensemble of the heuristic score and a QLoRA fine-tuned Qwen2.5-3B-Instruct model (running locally via llama.cpp) to produce the final top 100 predictions. Runtime is roughly a minute on Mac M2.

# ============================================================================
# Declarations
# ============================================================================
declarations:
  read_submission_spec: true        # I have read submission_spec.md in full
  code_is_original_work: true       # My code is my team's original work (using AI as a tool is fine)
  no_collusion: true                # I have not coordinated my submission with other teams
  honeypot_check_done: true        # OPTIONAL — set true if you explicitly checked for honeypots in your ranking
  reproduction_tested: true         # I have tested that my reproduce_command runs end-to-end
