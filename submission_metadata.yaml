ai_usage_summary: |
  Gemini and Claude were used for architectural planning, fine-tuning strategy design,
  and code review. All training and inference runs locally. No candidate data was
  transmitted to any external model or API at any point during ranking.

methodology_summary: |
  Our solution is a three-stage hybrid ranking pipeline combining semantic retrieval,
  heuristic scoring, and local LLM re-ranking.

  Stage 1 - Semantic Retrieval: Candidate profiles are encoded offline using
  BAAI/bge-small-en-v1.5 and stored in a FAISS IndexFlatIP. At ranking time, the
  parsed job description is embedded and used to retrieve the top 2,000 candidates
  by cosine similarity.

  Stage 2 - Heuristic Pre-scoring: The retrieved pool is narrowed using hard filters
  (experience bounds) followed by an ensemble heuristic that weights semantic
  similarity, recruiter response rate, GitHub activity score, and a skill quality
  ratio (endorsement duration per skill, penalizing keyword stuffers).

  Stage 3 - LLM Re-ranking: The top 200 candidates from Stage 2 are evaluated
  by a QLoRA fine-tuned Qwen2.5-3B-Instruct model, quantized to Q4_K_M and served
  locally via llama.cpp. The model produces a fit score and structured reasoning
  string per candidate. Final scores are an ensemble of the LLM output and the
  heuristic score.

  Honeypot defense is applied as a pre-filter before any ML processing. Total
  end-to-end ranking runtime is under 5 minutes on CPU with 16GB RAM.

